.house-wrap{position:relative;padding-top:34px;margin:4px 6px 0}
.roof{position:absolute;left:-4%;top:0;width:108%;height:auto;fill:none;stroke-linecap:round;stroke-linejoin:round;overflow:visible;filter:drop-shadow(0 10px 14px rgba(185,88,11,.35))}

.house{position:relative;aspect-ratio:1/1.04;clip-path:polygon(50% 0,100% 32%,100% 100%,0 100%,0 32%);border-radius:0 0 36px 36px;overflow:hidden;background:var(--blue2)}
.house img{width:100%;height:100%;object-fit:cover;object-position:46% 62%;display:block}

.tag span{width:32px;height:32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#EEF0FA);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center}
.tag img{width:19px;height:auto}

/* botões: pílulas com corpo, como os botões e as abas do site */
.nav{display:flex;flex-direction:column;gap:10px;margin-top:6px}

.lk .sheen{position:absolute;top:-2px;bottom:-2px;left:0;width:55%;z-index:-1;background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.55) 50%,rgba(255,255,255,0) 100%);transform:translate3d(-130%,0,0) skewX(-18deg);pointer-events:none}
.ico{position:relative;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(180deg,#3446B4,#243084);box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 10px 18px -10px rgba(14,19,71,.7)}

.ico svg{position:relative;width:23px;height:23px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:stroke .8s var(--e)}
.ico svg.wa{fill:#fff;stroke:none;width:22px;height:22px;transition:fill .8s var(--e)}
.tx{display:flex;flex-direction:column;min-width:0}
.tx strong{font-size:16.5px;font-weight:800;letter-spacing:-.015em;line-height:1.2}
.tx small{margin-top:2px;font-size:13.5px;color:var(--muted);font-weight:400}
.go{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--tint);box-shadow:inset 0 1px 2px rgba(14,19,71,.06);transition:background .8s var(--e)}

@media (prefers-reduced-motion:no-preference){

  .roofs,.foot{animation-delay:.46s}
}
@keyframes sobe{from{opacity:0;transform:translate3d(0,14px,0)}to{opacity:1;transform:none}}
@keyframes telhado{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
